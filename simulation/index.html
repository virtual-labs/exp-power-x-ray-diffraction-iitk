<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/controlpanel.css" />
    <link rel="stylesheet" href="simulation\css\modify.css">
    <link rel="stylesheet" href="css/controlpanel.css" />
    <link rel="stylesheet" href="css/output.css" />
    <link rel="stylesheet" href="css/simulator.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>XRD!</title>
  </head>
  <body>
    
    <!-- Language choose dialogue box  -->

    <div id="dialogue-box-parent" style="
    width: 100vw;height: 100vh; z-index: 999;
    position: absolute; background-color: rgba(0, 0, 0, 0.8); display: block;">
      <div class="dialogue-box">
          <h1>WELCOME TO THE XRD SIMULATION</h1>
          <h4 style="color: #16b639; font-style: italic">
              Choose the language for instructions:
          </h4>
          <div style="display: flex;">
              <button onclick="englishVoice(this)" style="background-color: green;">
                  ENG
              </button>
              <button onclick="hindiVoice(this)" style="background-color: red;">
                  HIN
              </button>
          </div>
      </div>
  </div>



    <!-- instruction -->
    <div id="instruction-box" class="container-fluid" style="display: flex;" >
      <h3>Instruction: <span id="typer" style=" color: rgb(255, 255, 255); font-size: 1.8rem; font-weight: 400; ">  </span> </h3>



    </div>
    <div class="row mb-3">
      <!-- control panel -->
      <div class="col-xl-4 themed-grid-col" id="control">
        <!-- on/off button -->
        <div class="container-fluid">
          <div class="button-container">
            <button id="onButton" class="on-button" onclick="disableSelect()">On</button>
            <button id="offButton" class="off-button" onclick="enableSelect()">Off</button>
          </div>
        </div>
        <!-- specimen -->
        <div class="container-fluid" id="box1">
          SPECIMEN
          <div class="container" id="selection" style="gap: 10px;">
            <label for="options" class="specimen">Select a Specimen:</label>
            <select id="material" name="material" disabled onchange="changeSampleImage() ;">
              <option value="">None</option>
              <option value="sand">Pure Si</option>
              <!-- <option value="paper">Paper</option>
              <option value="aluminium">Aluminium</option>
              <option value="glass">Glass</option> -->
            </select>
          </div>
         
          <div class="toggle-button" style="gap: 10px;">
            Door
            <label class="toggle-container" >
              <input type="checkbox" id="toggle" class="hidden-checkbox"  disabled  />
              <div class="slider-tb"></div>
            </label>
          </div>
        </div>
        <!-- Xray tube -->
        <div class="container-fluid" id="box2">
          X-RAY TUBE
          <label  class="button-container" style="gap: 10px;">
            <input
              type="radio"
              name="button-option"
              id="option1"
              class="hidden-radio"
              style=" width: 20px; 
              height: 20px;" disabled 
            />
            <span class="button-label" >STANDBY&nbsp;ON/OFF</span>
          </label>
        <!-- voltage and current slider -->
<div class="slider-container">

    <!-- VOLTAGE SECTION -->
    <div class="slider-value-container">
        <label for="voltage-slider" class="slider-label" style="font-size: 18px;">
            Voltage: 
            <span id="voltage-value" class="slider-value" style="font-size: 18px;">0 kV</span>
        </label>

        <!-- Set + Reset Buttons (Bootstrap) -->
       

        <!-- Your original slider (kept as-is) -->
     <div  class="d-flex align-items-center gap-2">
    <input type="range" id="voltage-slider" min="0" max="100" step="5" 
           value="0" class="slider" disabled>

    <button id="set-voltage" class="btn btn-success btn-sm">Set</button>

    <button id="reset-voltage" class="btn btn-danger btn-sm">Reset</button>
</div>

      
    </div>

    <!-- CURRENT SECTION -->
    <div class="slider-value-container">
        <label for="current-slider" class="slider-label" style="font-size: 18px;">
            Current: 
            <span id="current-value" class="slider-value" style="font-size: 18px;">0 mA</span>
        </label>

        <!-- Set + Reset Buttons -->
        

        <!-- Your original slider -->
          <div  class="d-flex align-items-center gap-2">

        <input type="range" id="current-slider" min="0" max="100" step="5" 
               value="0" class="slider mt-2" disabled>
              <button id="set-current" class="btn btn-success btn-sm ms-3">Set</button>
        <button id="reset-current" class="btn btn-danger btn-sm ms-2">Reset</button>
        </div>

    </div>

</div>



      
        </div>
        <!-- scan setting -->
        <div class="container-fluid" id="box3">
          START SCANNING
          <!-- start angle -->
          <!-- <div class="container" id="SA">
            <label for="start-angle" class="start-angle" style="width : 30%"
              >Start Angle (2θ)(deg°):</label
            >
            <input
           
              type="number"
              id="start-angle"
              name="start-angle"
              min="5"
              max="75"
              step="5"
              disabled
              onchange="rotateAndMoveImages()"
             >
           
          </div> -->
       <div class="container" id="SA">
  <label for="start-angle" class="start-angle" style="width: 30%">
    Start Angle (2θ)(deg°):
  </label>

  <input
    type="number"
    id="start-angle"
    name="start-angle"
    min="5"
    max="75"
    step="5"
    value="25"
    readonly
  >
</div>

          <!-- end angle -->
          <!-- <div class="container" id="EA">
            <label for="end-angle" class="end-angle" style="width : 30%">End Angle(2θ)(deg°):</label>
            <input
              type="number"
              id="end-angle"
              name="end-angle"
              min="75"
              max="180"
              step="5"
              onchange="moveDottedLine()"
              oninput="showDottedLine()"
            />
          </div> -->

          <div class="container" id="EA">
  <label for="end-angle" class="end-angle" style="width : 30%">
    End Angle (2θ)(deg°):
  </label>

  <input
    type="number"
    id="end-angle"
    name="end-angle"
    min="75"
    max="180"
    step="5"
    value="100"
    readonly
  />
</div>
          <!-- step size  -->
          <!-- <div class="container" id="SS">
            <label for="options" class="step-size" style="width : 30%">Step Size(deg°) :</label>
            <input id="options1" name="options"
            type="number"
            id="step"
            name="step"
            min=".001"
            max="1"
            step=".001"
            />
          </div> -->

          <div class="container" id="SS">
  <label for="options1" class="step-size" style="width : 30%">
    Step Size (deg°) :
  </label>

  <input
    type="number"
    id="options1"
    name="options"
    min="0.001"
    max="1"
    step="0.001"
    value="0.02"
    readonly
  />
</div>
          
         
          <!-- scan rate -->
          <!-- <div class="container" id="SR">
            <label for="options" class="scan-rate" style="width : 30%">Scan Rate(deg°/min):</label>
            <input id="options2"  onclick="cal()" name="options"
            type="number"
            id="step"
            name="step"
            min=".01"
            max="1"
            step=".01"
            />
          </div> -->
          <!-- scan time -->
          <!-- <div class="container" id="ST">
            <label for="scan-time" class="scan-time" style="width : 30%"
              >Scan Time(sec) :</label >
            <input style="width: 40% ; border-radius: 5px"  id="result" />
          </div> -->
        </div>
        <!-- start scan button -->
        <div class="container-fluid" id="box4">
          <button class="my-button" onclick="startScan1()" id="startScan">START SCAN</button>
          <button class="my-button">SAVE DIAGRAM</button>
        </div>
      </div>
      <!-- simulator -->
      <div class="col-xl-4 themed-grid-col">
        XRD SIMULATOR
        <div class="panel" style="    height: 95%;
        position: relative;
        margin-left: 10%;
        width: 96%;">
         <button  class="btn3" onclick="moveBox()"></button>
          <div id="gate" style="position: absolute;">
            <div class="door left-door" id="leftDoor"></div>
            <div class="door right-door" id="rightDoor"></div>
         </div>
          <img
            src="images/simulator/xrd.png"
            alt=""
            style=" height: 90%;width: 83%; margin-top: 30px;"/>
            <img src="images/simulator/holder.png" class="box" alt=""/>
            <div class="box"></div>
          <div style="position: absolute;left: 2%;top: 32%; width: 40%;" id="source">
            <img
              src="images/simulator/xray source.png" alt="Rotating Image" class="rotating-image" id="x-ray-source" style="width: 95%; transform-origin: center;
              transition: transform 0.5s; opacity: 0.8;"
              
            />
          </div>
          <!-- <div style="position: absolute;left:25%;top: 37%; width: 40%;" id="source">
             <img
              src="images/simulator/xray line.png" alt="Rotating Image" class="rotating-image" id="x-ray-source1" style="width: 52%;  visibility: hidden;"
              
            />
          </div> -->
          <div id="detector" style="position: absolute;left: 55%;
          top: 33%;">
            <img
              src="images/simulator/detector.png"alt="Rotating Image" class="rotating-image" id="detector-image" style=" width:54%; opacity: 0.8;"
            />
          </div>
          <div id="detector" style="position: absolute;left: 38%;
          top: 36%;">
            <img
              src="images/simulator/detector line.png"alt="Rotating Image" class="rotating-image" id="detector-image1" style=" width:36%; visibility: hidden;"
            />
          </div>
          <!-- <div class="dotted-line" id="dotted-line" style="    display: block;
          position: absolute;
          left: 48%;
          top: 21%;
          height: 155px;
          border-left: 3px dotted rgb(0, 0, 0);
          transform-origin: left center;
          transform: translateX(-50%) rotate(28deg);
          transition: transform 0.5s ease 0s;
      "></div> -->
        </div>
      </div>
     
     <!-- output -->
     <!-- <script>

  
     </script> -->
     <div class="col-xl-4 themed-grid-col">
      <img class="graph" src="images/output/graph.png" id="graph" style="height: 70%; width:98%; display: none; ">
     </div>
    </div>
   
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script

      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    
    <script src="js/main.js">
    </script>
  <script src="../assets/js/iframeResize.js"></script>
        
        </body>
</html>
